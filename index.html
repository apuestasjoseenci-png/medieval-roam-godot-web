		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #10251f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

html,body { width:100%;height:100%;overscroll-behavior:none; }
canvas { touch-action:none; }
#status { position:fixed;inset:0;overflow:hidden;visibility:visible; }
#status-splash.fullsize--true { width:100%;height:100%;max-width:none;max-height:none;margin:0;object-fit:cover;object-position:50% 43%; }
#loading-bar { position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(76%,420px);height:30px;box-sizing:border-box;border:3px ridge #bc9445;border-radius:5px;background:#1b211d;box-shadow:0 0 0 3px #161914,0 4px 14px #000b,inset 0 0 5px #000;font:bold 16px Georgia,serif;color:#fff4ce; }
#loading-bar::before,#loading-bar::after { content:'◆';position:absolute;top:2px;color:#dfb85c;text-shadow:0 2px #000; }
#loading-bar::before { left:-15px; } #loading-bar::after { right:-15px; }
#status-progress { display:block;position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;border-radius:1px;appearance:none;-webkit-appearance:none;background:#1b211d; }
#status-progress::-webkit-progress-bar { background:#1b211d; }
#status-progress::-webkit-progress-value { background:linear-gradient(#f5db8b,#ad762a 55%,#e5bc59); }
#status-progress::-moz-progress-bar { background:linear-gradient(#f5db8b,#ad762a 55%,#e5bc59); }
#loading-percent { position:absolute;inset:0;display:grid;place-items:center;text-shadow:0 1px 3px #000,1px 0 #000,-1px 0 #000;pointer-events:none; }

<style>
body { background:#10251f; }
#portrait-frame { position:fixed;overflow:hidden; }
#map-attribution { left:var(--portrait-left,0px)!important;right:auto!important;bottom:auto!important;top:var(--portrait-attribution-top,0px)!important;width:378px;box-sizing:border-box;transform:scale(var(--portrait-scale,1));transform-origin:top left; }
#portrait-frame canvas { width:100%;height:100%;touch-action:none; }
#portrait-safe { position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
<div id="portrait-safe" aria-hidden="true"></div>
<div id="portrait-hint" role="status" hidden>Vuelve a vertical para usar controles más cómodos</div>
<style>#portrait-hint {position:fixed;z-index:40;pointer-events:none;background:#172f29ed;color:#f4e8ca;font:13px Georgia,serif;text-align:center;padding:8px;box-sizing:border-box;border:1px solid #697754;border-radius:8px;max-width:220px;}#portrait-hint[hidden]{display:none;}</style>
<script>
// No CSS rotation: Godot maps touches through the canvas bounding rectangle.
// Policy 0 gives this shell ownership of size; rotation never restarts the engine.
(() => {
 const canvas=document.getElementById('canvas'),frame=document.getElementById('portrait-frame');
 globalThis.MedievalPortrait={safeInsets:[0,0,0,0],lock:'unavailable'};
 function fit() {
  const v=window.visualViewport,s=getComputedStyle(document.getElementById('portrait-safe'));
  const [l,t,r,b]=[s.paddingLeft,s.paddingTop,s.paddingRight,s.paddingBottom].map(n=>parseFloat(n)||0);
  const w=Math.max(1,(v?.width??innerWidth)-l-r),h=Math.max(1,(v?.height??innerHeight)-t-b);
  const landscape=w>h,ratio=landscape?390/844:w/h;
  const width=Math.min(w,h*ratio),height=width/ratio;
  Object.assign(frame.style,{left:((v?.offsetLeft??0)+l+(w-width)/2)+'px',top:((v?.offsetTop??0)+t)+'px',width:width+'px',height:height+'px'});
  document.documentElement.style.setProperty('--portrait-left',frame.style.left);
  document.documentElement.style.setProperty('--portrait-attribution-top',((v?.offsetTop??0)+t+height-30*width/390)+'px');
  document.documentElement.style.setProperty('--portrait-scale',width/390);
  const logicalHeight=landscape?844:Math.max(391,Math.round(390/ratio));
  if(canvas.width!==390)canvas.width=390;
  if(canvas.height!==logicalHeight)canvas.height=logicalHeight;
  Object.assign(MedievalPortrait,{width:390,height:logicalHeight,contained:landscape});
  const hint=document.getElementById('portrait-hint'),gutter=(w-width)/2;
  hint.hidden=!(landscape&&64*width/390<44&&gutter>=90);
  Object.assign(hint.style,{left:((v?.offsetLeft??0)+l+8)+'px',top:((v?.offsetTop??0)+t+Math.max(0,(h-70)/2))+'px',width:Math.min(220,gutter-16)+'px'});
 }
 async function lock() {
  if(!screen.orientation?.lock)return;
  try { await screen.orientation.lock('portrait');MedievalPortrait.lock='locked'; }
  catch { MedievalPortrait.lock='container'; }
 }
 fit();lock();
 window.addEventListener('resize',fit);
 window.visualViewport?.addEventListener('resize',fit);
 window.visualViewport?.addEventListener('scroll',fit);
 document.addEventListener('fullscreenchange',lock);
 document.addEventListener('pointerup',lock);
})();
</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":7682556,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingBar = document.getElementById('loading-bar');
	const percent = document.getElementById('loading-percent');
	// Follow the visible browser viewport, including toolbar and rotation changes.
	const viewport = window.visualViewport;
	function fitViewport() {
		statusOverlay.style.width = (viewport ? viewport.width : innerWidth) + 'px';
		statusOverlay.style.height = (viewport ? viewport.height : innerHeight) + 'px';
		statusOverlay.style.left = (viewport ? viewport.offsetLeft : 0) + 'px';
		statusOverlay.style.top = (viewport ? viewport.offsetTop : 0) + 'px';
	}
	fitViewport();
	window.addEventListener('resize', fitViewport);
	viewport?.addEventListener('resize', fitViewport);
	viewport?.addEventListener('scroll', fitViewport);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			window.removeEventListener('resize', fitViewport);
			viewport?.removeEventListener('resize', fitViewport);
			viewport?.removeEventListener('scroll', fitViewport);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadingBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					percent.textContent = Math.floor(Math.min(1, current / total) * 100) + ' %';
				} else {
					// Unknown byte total has no truthful percentage. Keep one static bar.
					statusProgress.value = 0;
					statusProgress.max = 100;
					percent.textContent = 'Cargando…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
